version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis-troubleshooter
    ports:
      - "6379:6379"
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-troubleshooter
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

volumes:
  qdrant_storage: